

<!DOCTYPE html>
<html>

	<head>
		<meta charset="utf-8">
		<title>aidsvm</title>
        <script src="https://cdn.jsdelivr.net/npm/v86@0.5.462/build/libv86.min.js"></script>
		<style type="text/css">
			body {background:black;}
			#screen_container  {
                width: 1024px !important;
                height:  768px !important;
                background: black;
                transform-origin: 0px 0px;
    overflow: hidden;
            }
canvas.active {
    width: 480px !important;
    height: 360px !important;
}
		</style>
<script>
const jsonData = [
    {
        name: "vm1",
        url: "/itsjustdos.img",
        type: "fda"
    },
    {
        name: "vm2",
        url: "/windows31.img",
        type: "hda"
    },
    {
        name: "vm3",
        url: "/third.img",
        type: "fda"
    }
];

function getVMFromHash() {
    const hashKey = window.location.hash.substring(1);

    return jsonData.find(vm => vm.name === hashKey);
}

const vm = getVMFromHash();

const emulatorConfig = {
    wasm_path: "https://cdn.jsdelivr.net/npm/v86@latest/build/v86.wasm",

    memory_size: 32 * 1024 * 1024,
    vga_memory_size: 2 * 1024 * 1024,

    screen_container: document.getElementById("screen_container"),

    bios: {
        url: "seabios.bin"
    },

    vga_bios: {
        url: "vgabios.bin"
    },

    autostart: true
};

// Add the selected disk
if (vm) {
    if (vm.type === "fda") {
        emulatorConfig.fda = {
            url: vm.url,
            async: true
        };
    }

    if (vm.type === "hda") {
        emulatorConfig.hda = {
            url: vm.url,
            async: true
        };
    }
}

function getV86StringFromHash(defaultString = "default_boot.img") {
    const hashKey = window.location.hash.substring(1);

    if (!hashKey) {
        return defaultString;
    }

    const vm = jsonData.find(item => item.name === hashKey);

    if (vm) {
        return vm.url;
    }

    return defaultString;
}




</script>
	</head>
	<body>

				
				<div id="display-outer">
					<div id="display">
						<div style="position: relative; width: 1024px; height: 768px;">
							<div style="position: relative; width: 1024px; height: 768px; transform-origin: 0px 0px;" id="screen_container">
<div style="white-space: pre;font-family: Liberation Mono, DejaVu Sans Mono, Courier New, monospace;font-size: 16px;line-height: 17px;display: block;"></div>
    <canvas style="display:none"></canvas>
							</div>
						</div>
					</div>
				</div>
		</div>		
        <script>
window.onload = function () {
    try {
        const emulator = window.emulator = new V86(emulatorConfig);
    } catch (e) {
        const error = document.querySelector("notice.error");

        if (error) {
            error.hidden = false;
            error.textContent = `An error has occurred: ${e.message}`;
        } else {
            console.error(e);
        }
    }
};

    setTimeout(() => {
        const canvas = document.querySelector("#screen_container canvas");
        if (!canvas) return;

        canvas.style.display = "block";

        canvas.addEventListener("click", async () => {
            if (!document.pointerLockElement) {
                await canvas.requestPointerLock();
            }
        });

        canvas.tabIndex = 1;
        canvas.focus();
    }, 500);

        
        const canvas = document.querySelector("canvas");

function updateCanvasState() {
    const rect = canvas.getBoundingClientRect();
    if (rect.width > 0 && rect.height > 0) {
        canvas.classList.add("active");
    } else {
        canvas.classList.remove("active");
    }
}

new ResizeObserver(updateCanvasState).observe(canvas);
updateCanvasState()
        </script>
	</body>
<script src="/disks.js" defer></script> <!-- floppyload(url) or cdload(url) or statesave() or getstate(arraybuffer) -->
</html>
